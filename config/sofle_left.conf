# Sofle LEFT half — SuperMini NRF52840 (nice_nano_v2)
# neuroman.tech: https://github.com/neuromantech/zmk-config
#
# Half-specific config. Applies ONLY to the sofle_left build.

# OLED display — OFF: not fitted yet.
# This DOES take effect via .conf, because the display stack is gated on
# CONFIG_ZMK_DISPLAY (not auto-selected by the devicetree node).
# Enable this line once the OLED is soldered in.
# CONFIG_ZMK_DISPLAY=y

# Rotary encoder.
# The in-tree shield overlay does `&left_encoder { status = "okay"; }`, and
# Zephyr auto-selects the EC11 driver from DT_HAS_ALPS_EC11_ENABLED, so
# CONFIG_EC11 is forced on regardless of what this file says. To truly disable
# it you would need a config overlay setting status="disabled".
#
# CRITICAL — an encoder with no TRIGGER MODE silently does nothing.
# app/module/drivers/sensor/ec11/Kconfig defines a choice whose DEFAULT is
# EC11_TRIGGER_NONE, and the driver's trigger code is:
#     #if defined(CONFIG_EC11_TRIGGER_OWN_THREAD)
#     #elif defined(CONFIG_EC11_TRIGGER_GLOBAL_THREAD)
# so under NONE neither branch compiles: no interrupt handler, no thread, and
# not one rotation event. Turning the knob does nothing, with no error anywhere,
# which is indistinguishable from the encoder not being soldered. Confirmed from
# the CI Kconfig dump (CONFIG_EC11_TRIGGER_NONE=y) after a long hunt.
# GLOBAL_THREAD is the conventional choice; it selects EC11_TRIGGER.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB underglow — LEDs not soldered, so leave off.
# (Unlike the encoder, this is not devicetree-forced: it needs a led_strip node
#  plus CONFIG_ZMK_RGB_UNDERGLOW=y.)
# CONFIG_ZMK_RGB_UNDERGLOW=y

# IDENTITY: a distinct USB product string, so identify_usb() tells you which board
# is plugged in BEFORE you flash it. This is the anti-wrong-board measure: the
# peripheral's product string used to be EMPTY, indistinguishable from a bare
# SuperMini. Max 16 characters.
CONFIG_ZMK_KEYBOARD_NAME="Sofle Left"

# ROLE: PERIPHERAL.
# ZMK's in-tree sofle defconfig defaults the LEFT half to central — override it,
# because the SuperMini dongle is our split central.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
