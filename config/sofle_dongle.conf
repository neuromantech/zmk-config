# Sofle split — DONGLE config (the split CENTRAL, shield sofle_dongle).
# https://github.com/neuromantech/zmk-config
#
# ZMK Studio = runtime keymap edits over USB or BLE, with no reflashing.
# Only this build gets Studio: peripherals have no RPC endpoint by design
# (app/src/studio/Kconfig selects ZMK_STUDIO_RPC only for the central).
#
# The USB endpoint comes from the `studio-rpc-usb-uart` SNIPPET in build.yaml —
# snippets cannot be set from a .conf file, which is why build.yaml is involved.

CONFIG_ZMK_STUDIO=y

# This dongle has NO KEYS of its own, so it cannot press a &studio_unlock combo.
# Disabling locking makes Studio start UNLOCKED (studio/core.c initialises its
# state from IS_ENABLED(CONFIG_ZMK_STUDIO_LOCKING)), so no keypress is needed.
#
# SECURITY NOTE: with locking off, any client that can reach the Studio GATT
# service can rewrite the keymap with no confirmation. To harden later, set
# CONFIG_ZMK_STUDIO_LOCKING=y here AND bind &studio_unlock in the keymap — but
# note the keymap is SHARED with the halves, which build without Studio and
# would fail to link on &studio_unlock (src/studio/ is only compiled when
# ZMK_STUDIO is on). Such a binding must be guarded, e.g.
#   #ifdef ZMK_BEHAVIORS_KEEP_ALL   /* defined by the studio snippet */
CONFIG_ZMK_STUDIO_LOCKING=n

# IDENTITY: override the shield default ("Sofle") so the USB product string says
# WHICH board this is. identify_usb() prints product + serial before every flash,
# and the three SuperMinis are otherwise indistinguishable. Max 16 characters.
CONFIG_ZMK_KEYBOARD_NAME="Sofle Dongle"
