# Sofle — shared config (applies to sofle_left, sofle_right AND sofle_dongle,
# because the base name "sofle" is a candidate for all three).
#
# Only settings that are safe/wanted on EVERY build belong here.
# Do NOT put display/encoder Kconfig here — the keyless dongle has none of
# those nodes, and .conf files ACCUMULATE (every matching one is applied).
# Hardware-specific settings live in config/sofle_left.conf / sofle_right.conf.

# --- Split-link reliability -------------------------------------------------

# BLE transmit power: +8 dBm (max on nRF52840; steps of 4 from -20..+8).
# ZMK docs (troubleshooting/connection-issues): "This setting can also improve
# the connection strength between the keyboard halves for split keyboards."
# Power-cost difference is negligible, so this stays.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Crystalline oscillator: NOT needed (ruled out) -------------------------
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
#
# This was enabled twice while chasing "works briefly, then disconnects".
# It was NOT the cause. The real cause was the POWER SOURCE: the half was on a
# USB power bank, and once the keyboard idled into its low-power state the draw
# fell below the bank's low-load cutoff, so the bank cut the rail. Symptom
# mimicry was near-perfect - works briefly, dies, power-cycle revives it
# briefly, board runs cold.
#
# Fix is the power source: a LiPo on the controller's battery connector, a wall
# charger, the host's own USB port, or a bank's low-current mode. No firmware
# involvement. Keeping RC would only cost battery life on the halves.
#
# If a genuine link-drop problem ever appears on adequate power, re-enable it
# here to test the oscillator, and note it costs runtime.
