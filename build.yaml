# Sofle split — 3x SuperMini NRF52840 (ZMK board id: nice_nano_v2)
# neuroman.tech: https://github.com/neuromantech/zmk-config
#
# Matrix is `include:` ONLY — GitHub Actions merges include entries into any
# matching top-level board/shield combination, which silently drops builds.
#
# Roles (the dongle is the split CENTRAL):
#   sofle_dongle    central, no keys  -> FLASH FIRST  (board currently connected)
#   sofle_right     peripheral        -> next
#   sofle_left      peripheral        -> 3rd SuperMini, in transit
#   settings_reset  clears bonds      -> flash to every part before pairing
#
# Roles are set in config/*.conf + boards/shields/sofle/Kconfig.defconfig,
# not via cmake-args, so `zmk` and `west` builds behave identically.
#
# EXCEPTION: ZMK Studio's USB endpoint is a SNIPPET, which cannot be expressed
# in a .conf file — hence `snippet:` on the dongle entry below. Its Kconfig
# (CONFIG_ZMK_STUDIO) lives in config/sofle_dongle.conf.

include:
  - board: nice_nano_v2
    shield: sofle_dongle
    artifact-name: sofle_dongle
    # ZMK Studio: adds the USB CDC-ACM endpoint (and the BLE GATT service is
    # on by default). Central ONLY — peripherals have no Studio RPC endpoint,
    # by design, in app/src/studio/Kconfig.
    snippet: studio-rpc-usb-uart

  - board: nice_nano_v2
    shield: sofle_right
    artifact-name: sofle_right

  - board: nice_nano_v2
    shield: sofle_left
    artifact-name: sofle_left

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
