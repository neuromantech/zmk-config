# Sofle RIGHT half — SuperMini NRF52840 (nice_nano_v2)
# neuroman.tech: https://github.com/neuromantech/zmk-config
#
# Half-specific config. Applies ONLY to the sofle_right build.

# OLED display — OFF: not fitted yet.
# This one DOES take effect via .conf, because the display stack is gated on
# CONFIG_ZMK_DISPLAY (not auto-selected by the devicetree node).
# Enable this line once the OLED is soldered in.
# CONFIG_ZMK_DISPLAY=y

# Rotary encoder — do NOT try to gate this here.
# The in-tree shield overlay does `&right_encoder { status = "okay"; }`, and
# Zephyr auto-selects the EC11 driver from DT_HAS_ALPS_EC11_ENABLED, so
# CONFIG_EC11 is forced on regardless of what this file says. Unpopulated it is
# harmless (the shield sets those pins to pull-up, so nothing floats and no
# interrupts fire), and it means the encoder works as soon as it is soldered.
# To truly disable it you would need a config overlay setting status="disabled".

# RGB underglow — LEDs not soldered, so leave off.
# (Unlike the encoder, this is not devicetree-forced: it needs a led_strip node
#  plus CONFIG_ZMK_RGB_UNDERGLOW=y.)
# CONFIG_ZMK_RGB_UNDERGLOW=y

# ROLE: PERIPHERAL.
# The SuperMini dongle (shield sofle_dongle) is the split CENTRAL, so both
# halves are peripherals. ZMK's ROLE_CENTRAL default is n; stated explicitly
# so the dongle is unambiguously the only central.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
