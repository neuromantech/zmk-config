# Sofle — shared config (applies to sofle_left, sofle_right AND sofle_dongle,
# because the base name "sofle" is a candidate for all three).
#
# Only settings that are safe/wanted on EVERY build belong here.
# Do NOT put display/encoder Kconfig here — the keyless dongle has none of
# those nodes, and .conf files ACCUMULATE (every matching one is applied).
# Hardware-specific settings live in config/sofle_left.conf / sofle_right.conf.

# --- Split-link reliability -------------------------------------------------

# BLE transmit power: +8 dBm (max on nRF52840; steps of 4 from -20..+8).
# ZMK docs (troubleshooting/connection-issues): "This setting can also improve
# the connection strength between the keyboard halves for split keyboards."
# Power-cost difference is negligible, so this stays.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Deliberately NOT set ---------------------------------------------------
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
#
# This is ZMK's workaround for a faulty 32.768kHz oscillator. It was enabled
# while the link was dropping, but the real fault turned out to be HARDWARE:
# a damaged VCC pin trace was shorting and heating the board (hot even in the
# UF2 bootloader, with no radio running), sagging the rail and browning out the
# radio. With that trace cut the board runs cool.
#
# Keeping RC would cost battery life for no benefit, so it is off. If the link
# turns out to be flaky for a different reason, re-add it here to test.
