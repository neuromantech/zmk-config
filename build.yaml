# Sofle RGB (split) + SuperMini NRF52840 BLE dongle
# 3× SuperMini NRF52840 boards from customkbd:
#   - 2× in hand RIGHT NOW: right half + BLE dongle/concentrator (testing now)
#   - 1× in transit from Melbourne: left half (add when it arrives)
#
# SuperMini works in ZMK as nice_nano_v2 (pin-compatible, per joric/nrfmicro wiki).
# Sofle RGB underglow built-in — NOT enabled (LEDs not soldered).
# Encoders enabled on both halves.
#
# Flash order: dongle first (central), then right half (peripheral).
# Left half added when 3rd SuperMini arrives.

board:
  - nice_nano_v2
shield:
  - sofle_right

# BLE dongle / concentrator — central role for split connection
include:
  - board: nice_nano_v2
    artifact-name: supermini-dongle
    cmake-args: >-
      -DCONFIG_ZMK_BLE=y
      -DCONFIG_ZMK_SPLIT_BLE=y
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
      -DCONFIG_BT_MAX_CONN=6

# Left half — uncomment when the 3rd SuperMini arrives from Melbourne
# shield:
#   - sofle_left
