# Sofle LEFT half — SuperMini NRF52840 (nice_nano_v2)
# neuroman.tech: https://github.com/neuromantech/zmk-config
#
# Half-specific config. Applies ONLY to the sofle_left build.

# --- Hardware NOT fitted yet: keep these OFF -------------------------------
# Enabling a driver for absent hardware is dead weight, and can destabilise
# the board. Stock ZMK ships the sofle shield with both of these commented out.
# OLED display (SSD1306 128x32, I2C on pro_micro D2/D3 = P0.17/P0.20):
# CONFIG_ZMK_DISPLAY=y
# Rotary encoder (EC11, on pro_micro D20/D21 = P0.29/P0.31):
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# RGB underglow (LEDs not soldered):
# CONFIG_ZMK_RGB_UNDERGLOW=y

# ROLE: PERIPHERAL.
# ZMK's in-tree sofle defconfig defaults the LEFT half to central — override it,
# because the SuperMini dongle is our split central.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
