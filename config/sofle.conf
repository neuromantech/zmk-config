# Sofle — shared config (applies to sofle_left, sofle_right AND sofle_dongle,
# because the base name "sofle" is a candidate for all three).
#
# Only settings that are safe/wanted on EVERY build belong here.
# Do NOT put display/encoder Kconfig here — the keyless dongle has none of
# those nodes, and .conf files ACCUMULATE (every matching one is applied).
# Hardware-specific settings live in config/sofle_left.conf / sofle_right.conf.

# --- Split-link reliability -------------------------------------------------

# BLE transmit power: +8 dBm (max on nRF52840; steps of 4 from -20..+8).
# ZMK docs (troubleshooting/connection-issues): "This setting can also improve
# the connection strength between the keyboard halves for split keyboards."
# Power-cost difference is negligible.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Use the nRF52840's INTERNAL RC oscillator for the 32.768kHz low-frequency
# clock instead of the external crystal.
# ZMK docs (troubleshooting/connection-issues, "Mitigating a Faulty
# Oscillator"): required when a board has a faulty/marginal 32.768kHz crystal,
# which otherwise causes the wireless link to drop (open, work briefly, die).
# In-tree references: https://docs.zephyrproject.org K32SRC options.
#
# SuperMini NRF52840 boards are a well-documented offender here (joric/nrfmicro
# wiki: "Many people have also observed issues with the 32.768kHz crystal").
#
# TRADEOFF: higher power draw than the crystal. Negligible on the USB-powered
# dongle; measurable on battery-powered halves. If the keyboard proves stable,
# this can be bisected out later to recover battery life.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
