# Sofle LEFT half — SuperMini NRF52840 (nice_nano_v2)
# neuroman.tech: https://github.com/neuromantech/zmk-config
#
# Half-specific config. Applies ONLY to the sofle_left build.
# (Kept separate from any shared conf so the keyless dongle build, which has
#  no display/encoder nodes, never inherits these.)

# OLED display (SSD1306 128x32 on the Sofle PCB)
CONFIG_ZMK_DISPLAY=y

# EC11 rotary encoder (left)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ROLE: PERIPHERAL.
# ZMK's in-tree sofle defconfig defaults the LEFT half to central — override it,
# because the SuperMini dongle is our split central.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# RGB underglow — NOT enabled: LEDs are not soldered on this build
# CONFIG_ZMK_RGB_UNDERGLOW=y
