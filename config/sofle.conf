#
# SuperMini NRF52840 (nice_nano_v2) + Sofle PCB
# neuroman.tech: https://github.com/neuromantech/zmk-config
#
# Enabled: OLED display, encoders (both halves), NO RGB underglow (LEDs not soldered)

# OLED screen on each half
CONFIG_ZMK_DISPLAY=y

# EC11 encoders — enabled on both halves for this build
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB underglow — disabled: LEDs not soldered yet
# CONFIG_ZMK_RGB_UNDERGLOW=y

# External power toggling by underglow — disabled to decouple display/encoder power
# from the RGB circuit (won't matter until RGB is enabled, but future-proofing)
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
