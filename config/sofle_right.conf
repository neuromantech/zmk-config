# Sofle RIGHT half — SuperMini NRF52840 (nice_nano_v2)
# neuroman.tech: https://github.com/neuromantech/zmk-config
#
# Half-specific config. Applies ONLY to the sofle_right build.

# OLED display (SSD1306 128x32 on the Sofle PCB)
CONFIG_ZMK_DISPLAY=y

# EC11 rotary encoder (right)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ROLE: PERIPHERAL.
# The SuperMini dongle (shield sofle_dongle) is the split CENTRAL, so both
# halves are peripherals. ZMK's ROLE_CENTRAL default is n; stated explicitly
# here so the dongle is unambiguously the only central.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# RGB underglow — NOT enabled: LEDs are not soldered on this build
# CONFIG_ZMK_RGB_UNDERGLOW=y
