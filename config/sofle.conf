# Sofle — shared config (applies to sofle_left, sofle_right AND sofle_dongle,
# because the base name "sofle" is a candidate for all three).
#
# Only settings that are safe/wanted on EVERY build belong here.
# Do NOT put display/encoder Kconfig here — the keyless dongle has none of
# those nodes, and .conf files ACCUMULATE (every matching one is applied).
# Hardware-specific settings live in config/sofle_left.conf / sofle_right.conf.

# --- Split-link reliability -------------------------------------------------

# BLE transmit power: +8 dBm (max on nRF52840; steps of 4 from -20..+8).
# ZMK docs (troubleshooting/connection-issues): "This setting can also improve
# the connection strength between the keyboard halves for split keyboards."
# Power-cost difference is negligible, so this stays.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# INTERNAL RC oscillator for the 32.768kHz low-frequency clock, instead of the
# external crystal. ZMK's documented workaround for a faulty oscillator.
#
# History: this was enabled while chasing the dropouts, then removed when a
# damaged VCC pin trace was found (the board ran hot even in the UF2 bootloader,
# which no firmware can cause). The heat IS fixed by that trace cut -
# but the DISCONNECTS PERSISTED with the board running cool, so the short was
# not their cause.
#
# The oscillator has therefore still never been ruled out, and a bad 32.768kHz
# crystal is the classic cause of exactly this symptom (link opens, works, dies;
# power-cycle brings it back) - and SuperMini boards are well known for it.
# TRADEOFF: costs battery life on the halves. Remove again once stability is
# proven, to recover runtime.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# --- Deliberately NOT set ---------------------------------------------------
# (See the notes above: K32SRC_RC is currently ON, to rule the oscillator out.)
